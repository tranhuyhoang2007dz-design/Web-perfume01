<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#F8F7F4"/>
  <g transform="translate(100, 50)">
    <!-- Cap -->
    <rect x="75" y="20" width="50" height="35" rx="3" fill="#1C1C1C"/>
    <rect x="70" y="55" width="60" height="8" rx="1" fill="#C2A26B"/>
    <!-- Atomizer neck -->
    <rect x="88" y="63" width="24" height="15" fill="#E0DCD3"/>
    <!-- Bottle Shoulder & Body -->
    <path d="M 40 85 L 160 85 Q 175 85 175 100 L 175 250 Q 175 265 160 265 L 40 265 Q 25 265 25 250 L 25 100 Q 25 85 40 85 Z" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="2"/>
    <!-- Perfume Liquid Level -->
    <path d="M 32 140 L 168 140 L 168 250 Q 168 258 160 258 L 40 258 Q 32 258 32 250 Z" fill="#F4EFE6" opacity="0.8"/>
    <!-- Bottle Label -->
    <rect x="52" y="145" width="96" height="80" rx="2" fill="#FFFFFF" stroke="#C2A26B" stroke-width="1"/>
    <text x="100" y="172" font-family="'Playfair Display', serif" font-size="11" font-weight="600" fill="#1C1C1C" text-anchor="middle" letter-spacing="2">PARFUM</text>
    <line x1="75" y1="182" x2="125" y2="182" stroke="#C2A26B" stroke-width="0.8"/>
    <text x="100" y="198" font-family="sans-serif" font-size="8" fill="#707070" text-anchor="middle" letter-spacing="1">EAU DE PARFUM</text>
    <text x="100" y="212" font-family="sans-serif" font-size="7" fill="#A0A0A0" text-anchor="middle">100 ML</text>
  </g>
</svg>

